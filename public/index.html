<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频转 MP3 - 在线音频提取工具</title>
  <link rel="stylesheet" href="/styles/main.css">

</head>

<body>
  <header class="header">
    <h1>🎵 视频转 MP3</h1>
    <p class="subtitle">浏览器本地转换，无需上传服务器</p>
  </header>

  <main class="container">
    <!-- 上传区域 -->
    <section class="upload-section" id="uploadSection">
      <div class="drop-zone" id="dropZone">
        <div class="drop-zone-content">
          <svg class="upload-icon" viewBox="0 0 24 24" width="48" height="48">
            <path fill="currentColor"
              d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z" />
          </svg>
          <p>拖拽视频文件到此处，或 <span class="browse-link">点击浏览</span></p>
          <p class="hint">支持 MP4 / WebM / AVI / MOV / MKV 等视频格式</p>
        </div>
        <input type="file" id="fileInput" hidden accept="video/*,.mkv,.avi,.mov,.flv,.wmv">
      </div>
    </section>

    <!-- 文件预览 -->
    <section class="convert-section" id="convertSection" style="display: none;">
      <div class="file-preview" id="filePreview">
        <span class="file-icon">🎬</span>
        <div class="file-info">
          <div class="file-name" id="fileName"></div>
          <div class="file-size" id="fileSize"></div>
        </div>
      </div>

      <!-- 音质选项 -->
      <div class="quality-options">
        <label>音质选择：</label>
        <div class="radio-group">
          <label class="radio-item">
            <input type="radio" name="quality" value="0" checked>
            <span>高品质 (320kbps)</span>
          </label>
          <label class="radio-item">
            <input type="radio" name="quality" value="2">
            <span>标准 (192kbps)</span>
          </label>
          <label class="radio-item">
            <input type="radio" name="quality" value="5">
            <span>小文件 (128kbps)</span>
          </label>
        </div>
      </div>

      <button class="btn-primary" id="convertBtn">🎵 提取音频 → MP3</button>
    </section>

    <!-- 转换进度 -->
    <section class="status-section" id="statusSection" style="display: none;">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <p class="status-text" id="statusText">正在加载转换引擎...</p>
    </section>

    <!-- 转换结果 -->
    <section class="result-section" id="resultSection" style="display: none;">
      <div class="result-card" id="resultCard"></div>
    </section>
  </main>

  <footer class="footer">
    <p>全程在浏览器本地运行，视频不会上传到任何服务器</p>
  </footer>

  <script src="/lib/ffmpeg/ffmpeg.js"></script>
  <script src="/scripts/app.js"></script>
</body>

</html>
